# Nginx reverse proxy configuration for MedTrack on AWS EC2 (Amazon Linux 2023)
server {
    listen 80;
    server_name _;

    # Healthcare security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:;" always;

    # Client body size limit for diagnosis report uploads (16MB)
    client_max_body_size 16M;

    # Static assets caching
    location /static/ {
        alias /var/www/medtrack/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all dynamic traffic to Gunicorn socket / port
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Health check bypass for AWS ALB / Route 53 health monitors
    location /health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }
}
