{% extends "base.html" %}

{% block title %}Patient Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom py-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="doctor-avatar bg-primary text-white">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div>
                        <h4 class="mb-0 fw-bold">{{ patient.name }}</h4>
                        <span class="badge bg-primary-subtle text-primary">Patient ID: {{ patient.id }}</span>
                    </div>
                </div>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('patient.profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <h6 class="fw-bold text-uppercase text-secondary mb-3 small">Personal Information</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-medium">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ patient.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Email Address</label>
                            <input type="email" class="form-control bg-light" value="{{ patient.email }}" readonly>
                            <div class="form-text">Email address cannot be changed directly.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-medium">Mobile Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ patient.phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Date of Birth</label>
                            <input type="text" class="form-control bg-light" value="{{ patient.dob }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="gender" class="form-label fw-medium">Gender</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="male" {% if patient.gender == 'male' %}selected{% endif %}>Male</option>
                                <option value="female" {% if patient.gender == 'female' %}selected{% endif %}>Female</option>
                                <option value="other" {% if patient.gender == 'other' %}selected{% endif %}>Other</option>
                                <option value="prefer_not_to_say" {% if patient.gender == 'prefer_not_to_say' %}selected{% endif %}>Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <h6 class="fw-bold text-uppercase text-secondary mb-3 small">Contact & Emergency Details</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-12">
                            <label for="address" class="form-label fw-medium">Residential Address</label>
                            <input type="text" class="form-control" id="address" name="address" value="{{ patient.address }}" required>
                        </div>
                        <div class="col-md-12">
                            <label for="emergency_contact" class="form-label fw-medium">Emergency Contact</label>
                            <input type="text" class="form-control" id="emergency_contact" name="emergency_contact" value="{{ patient.emergency_contact }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('patient.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
