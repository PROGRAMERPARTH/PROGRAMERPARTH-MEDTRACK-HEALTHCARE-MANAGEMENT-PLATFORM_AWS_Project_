{% extends "base.html" %}

{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="card p-5 border-0 shadow-sm">
            <div class="mb-4">
                <span class="display-1 fw-bold text-primary">{{ code }}</span>
            </div>
            <h2 class="h3 fw-bold mb-3">{{ title }}</h2>
            <p class="text-muted mb-4 lead fs-6">{{ message }}</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-2"></i>Back to Home
                </a>
                <button onclick="window.history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
